services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-are}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-are_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-architecture_reasoning}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-are} -d ${POSTGRES_DB:-architecture_reasoning}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-are}:${POSTGRES_PASSWORD:-are_dev_password}@postgres:5432/${POSTGRES_DB:-architecture_reasoning}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
      LLM_MAX_ARCHITECTURE_CHARS: ${LLM_MAX_ARCHITECTURE_CHARS:-20000}
      LLM_MAX_QUESTION_CHARS: ${LLM_MAX_QUESTION_CHARS:-4000}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  postgres_data:
