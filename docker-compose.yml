services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-are}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-are_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-architecture_reasoning}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-are} -d ${POSTGRES_DB:-architecture_reasoning}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-are}:${POSTGRES_PASSWORD:-are_dev_password}@postgres:5432/${POSTGRES_DB:-architecture_reasoning}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
